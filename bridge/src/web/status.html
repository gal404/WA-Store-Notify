<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WA Store Notify — גשר</title>
<style>
  body { font-family: "Segoe UI", Arial, sans-serif; background: #f6f7f8; color: #1f2a2e; margin: 0; }
  header { background: #128C7E; color: #fff; padding: 14px 18px; font-size: 18px; font-weight: 600; }
  main { max-width: 640px; margin: 0 auto; padding: 18px 14px; }
  .card { background: #fff; border: 1px solid #e3e8ea; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .good { color: #007a3d; font-weight: 600; }
  .bad { color: #b3261e; font-weight: 600; }
  img#qr { width: 240px; max-width: 100%; display: block; margin: 12px auto; border: 1px solid #e3e8ea; border-radius: 10px; }
  input, button, textarea { font: inherit; font-size: 16px; }
  input, textarea { width: 100%; padding: 10px; border: 1px solid #e3e8ea; border-radius: 10px; box-sizing: border-box; }
  textarea { resize: vertical; min-height: 70px; }
  button { background: #128C7E; color: #fff; border: none; border-radius: 10px; padding: 11px 18px; cursor: pointer; margin-top: 8px; }
  button.ghost { background: none; color: #6b7a80; border: 1px solid #e3e8ea; }
  button:disabled { opacity: 0.6; cursor: default; }
  .stats span { display: inline-block; margin-inline-end: 16px; }
  #code { font-size: 30px; letter-spacing: 6px; text-align: center; color: #128C7E; font-weight: 700; direction: ltr; }
  .msg { font-size: 14px; margin-top: 8px; min-height: 18px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: right; padding: 6px 4px; border-bottom: 1px solid #eef1f2; vertical-align: top; }
  th { color: #6b7a80; font-weight: 600; }
  td.phone, td.when { direction: ltr; text-align: right; white-space: nowrap; }
  .hint { color: #6b7a80; }
  .warn { color: #a9711a; }
  .field-row { display: flex; gap: 8px; }
  .field-row input:first-child { max-width: 180px; }
  .pager { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .pager button { margin-top: 0; padding: 7px 14px; font-size: 14px; }
  .pager .pageinfo { color: #6b7a80; font-size: 13px; }
  .st-sent { color: #007a3d; font-weight: 600; }
  .st-failed { color: #b3261e; font-weight: 600; }
  .st-cancelled, .st-expired { color: #6b7a80; }
  .tbl-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  @media (max-width: 600px) {
    header { font-size: 16px; padding: 12px 14px; }
    main { padding: 12px 10px; }
    .card { padding: 12px; border-radius: 10px; }
    /* מספר + טקסט אחד מתחת לשני, אחרת שניהם נמעכים במסך צר */
    .field-row { flex-direction: column; }
    .field-row input:first-child { max-width: 100%; }
    /* כפתורים ברוחב מלא = יעד נגיעה נוח באצבע */
    button { width: 100%; }
    .pager { justify-content: space-between; }
    .pager button { width: auto; }
    .pager .pageinfo { order: -1; width: 100%; text-align: center; }
    table { font-size: 13px; }
    th, td { padding: 5px 3px; }
    .stats span { display: block; margin: 0 0 4px; }
  }
</style>
</head>
<body>
<header>WA Store Notify — גשר וואטסאפ</header>
<main>
  <div class="card" id="conn"><p>טוען…</p></div>
  <div class="card">
    <b>סטטיסטיקות</b>
    <p class="stats" id="stats">—</p>
    <p id="flags"></p>
  </div>
  <div class="card">
    <b>תור הודעות ממתינות</b>
    <div id="queueWrap"><p class="hint">טוען…</p></div>
  </div>
  <div class="card">
    <b>היסטוריית הודעות</b>
    <div id="historyWrap"><p class="hint">טוען…</p></div>
    <div class="pager" id="historyPager"></div>
  </div>
  <div class="card">
    <b>שליחה מיידית מהגשר</b>
    <p class="hint">שליחה ישירה, בלי לעבור דרך תור ה-WP — לא כפופה לתקרות/שעות שקט, ולא נרשמת ביומן ההודעות של WP. לבדיקות בלבד, לא לשימוש שגרתי.</p>
    <div class="field-row">
      <input id="snPhone" placeholder="9725XXXXXXXX" dir="ltr">
      <textarea id="snText" placeholder="טקסט ההודעה" style="flex:1"></textarea>
    </div>
    <button onclick="sendNow()" id="snBtn">שלח עכשיו</button>
    <div class="msg" id="snMsg"></div>
  </div>
</main>
<script>
let timer = null;
function schedule(ms) { clearTimeout(timer); timer = setTimeout(refresh, ms); }

function fmtWhen(s) {
  if (!s) return '—';
  const d = new Date(s.replace(' ', 'T'));
  if (isNaN(d.getTime())) return s;
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const hm = d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
  return sameDay ? hm : d.toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit' }) + ' ' + hm;
}

// "למה זה מחכה" — לפי הכללים בפועל (rules), התקרות (counters) ומצב ההשהיה, לא רק scheduled_at
function whyWaiting(item, rules, counters, quiet, paused) {
  if (item.status === 'claimed') return '<span class="good">בטיפול על ידי הגשר עכשיו…</span>';
  const tr = (rules && rules.transactional) || {};
  const forced = Number(item.priority) <= -10;
  // השהיה כללית עוצרת הכול חוץ מהודעות שנדחפו ידנית ("שלח מיידית"/"שלח לי לבדיקה")
  if (paused && !forced) {
    return '<span class="bad">השליחה מושהית — לחץ "שלח מיידית" ביומן כדי לדחוף הודעה זו</span>';
  }
  const now = new Date();
  const sch = item.scheduled_at ? new Date(item.scheduled_at.replace(' ', 'T')) : null;
  if (sch && sch.getTime() > now.getTime()) {
    return 'מתוזמן ל-' + fmtWhen(item.scheduled_at) + (item.attempts > 0 ? ' (ניסיון חוזר)' : '');
  }
  if (quiet && !forced) return '<span class="warn">שעות שקט — ימתין עד ' + (tr.quiet_to || '08:00') + '</span>';
  if (forced) return '<span class="good">נדחף ידנית — אמור להישלח בסיבוב הבא</span>';
  if (item.kind !== 'test' && (counters.sent_hour || 0) >= (tr.hourly_cap || Infinity)) {
    return '<span class="warn">תקרה שעתית מלאה (' + counters.sent_hour + '/' + tr.hourly_cap + ')</span>';
  }
  if (item.kind !== 'test' && (counters.sent_today || 0) >= (tr.daily_cap || Infinity)) {
    return '<span class="warn">תקרה יומית מלאה (' + counters.sent_today + '/' + tr.daily_cap + ')</span>';
  }
  return 'אמור להיתפס בסיבוב הבא';
}

function renderQueue(d) {
  const wrap = document.getElementById('queueWrap');
  const q = d.queue;
  if (!q || q.error) { wrap.innerHTML = '<p class="bad">לא ניתן לטעון את התור' + (q && q.error ? ': ' + q.error : '') + '</p>'; return; }
  const items = q.items || [];
  if (!items.length) { wrap.innerHTML = '<p class="hint">התור ריק כרגע.</p>'; return; }
  let html = '<div class="tbl-scroll"><table><thead><tr><th>טלפון</th><th>סוג</th><th>הזמנה</th><th>סטטוס</th><th>מתי יישלח</th></tr></thead><tbody>';
  items.forEach(function (item) {
    // whyWaiting מחזיר HTML מכוון (span עם מחלקה) — שאר השדות עוברים escaping
    html += '<tr>' +
      '<td class="phone">' + esc(item.phone_e164) + '</td>' +
      '<td>' + esc(item.kind) + '</td>' +
      '<td>' + (item.order_id ? '#' + esc(item.order_id) : '—') + '</td>' +
      '<td>' + (item.status === 'claimed' ? 'בטיפול' : 'ממתין') + '</td>' +
      '<td>' + whyWaiting(item, d.rules, d.counters || {}, d.quiet, d.paused) + '</td>' +
      '</tr>';
  });
  html += '</tbody></table></div>';
  wrap.innerHTML = html;
}

// ---- היסטוריית הודעות (מדפדפת, 10 בעמוד) ----
var historyPage = 1;
var historyLoading = false;
var historyError = false;
var HISTORY_LABELS = { sent: 'נשלח', failed: 'נכשל', cancelled: 'בוטל', expired: 'פג' };

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// מצייר ניווט "התאוששות" אחרי כשל — קריטי כי כפתורי הקודם/הבא הם דרך הכניסה
// היחידה של המשתמש ל-loadHistory. בלי זה, כשל בעמוד 2+ היה משאיר את הכרטיס
// תקוע לצמיתות (הרענון האוטומטי חוזר רק לעמוד 1) עד רענון מלא של הדפדפן.
function renderHistoryRecovery(pager, failedPage) {
  pager.innerHTML =
    '<button class="ghost" id="hRetry">נסה שוב</button>' +
    (failedPage > 1 ? '<button class="ghost" id="hFirst">חזרה לעמוד הראשון</button>' : '');
  var retry = document.getElementById('hRetry');
  var first = document.getElementById('hFirst');
  if (retry) retry.addEventListener('click', function () { loadHistory(failedPage); });
  if (first) first.addEventListener('click', function () { loadHistory(1); });
}

async function loadHistory(page) {
  if (historyLoading) return;
  historyLoading = true;
  var wrap = document.getElementById('historyWrap');
  var pager = document.getElementById('historyPager');
  var d;
  try {
    d = await (await fetch('/api/history?page=' + encodeURIComponent(page) + '&per=10')).json();
  } catch (e) {
    historyLoading = false;
    historyError = true;
    historyPage = page;
    wrap.innerHTML = '<p class="bad">אין תקשורת עם הגשר</p>';
    renderHistoryRecovery(pager, page);
    return;
  }
  historyLoading = false;

  if (!d.ok) {
    historyError = true;
    historyPage = page;
    wrap.innerHTML = '<p class="bad">לא ניתן לטעון היסטוריה' + (d.error ? ': ' + esc(d.error) : '') + '</p>';
    renderHistoryRecovery(pager, page);
    return;
  }

  historyError = false;
  historyPage = d.page || 1;
  var items = d.items || [];
  if (!items.length) {
    wrap.innerHTML = '<p class="hint">אין עדיין הודעות בהיסטוריה.</p>';
    // אם איכשהו נחתנו על עמוד ריק מעבר לראשון — משאירים דרך חזרה
    if (historyPage > 1) { renderHistoryRecovery(pager, historyPage); } else { pager.innerHTML = ''; }
    return;
  }

  var html = '<div class="tbl-scroll"><table><thead><tr>' +
    '<th>מתי</th><th>טלפון</th><th>סוג</th><th>הזמנה</th><th>סטטוס</th>' +
    '</tr></thead><tbody>';
  items.forEach(function (it) {
    var label = HISTORY_LABELS[it.status] || it.status;
    var cls = 'st-' + it.status;
    var err = it.last_error
      ? '<br><small class="bad" title="' + esc(it.last_error) + '">' +
        esc(it.last_error.length > 40 ? it.last_error.slice(0, 40) + '…' : it.last_error) + '</small>'
      : '';
    html += '<tr>' +
      '<td class="when">' + fmtWhen(it.sent_at || it.created_at) + '</td>' +
      '<td class="phone">' + esc(it.phone_e164) + '</td>' +
      '<td>' + esc(it.kind) + '</td>' +
      '<td>' + (it.order_id ? '#' + esc(it.order_id) : '—') + '</td>' +
      '<td><span class="' + cls + '">' + esc(label) + '</span>' + err + '</td>' +
      '</tr>';
  });
  html += '</tbody></table></div>';
  wrap.innerHTML = html;

  var first = (d.page - 1) * d.per + 1;
  var last = Math.min(d.page * d.per, d.total);
  pager.innerHTML =
    '<button class="ghost" id="hPrev"' + (d.page <= 1 ? ' disabled' : '') + '>‹ הקודם</button>' +
    '<span class="pageinfo">' + first + '–' + last + ' מתוך ' + d.total + ' · עמוד ' + d.page + ' מתוך ' + d.pages + '</span>' +
    '<button class="ghost" id="hNext"' + (d.page >= d.pages ? ' disabled' : '') + '>הבא ›</button>';
  var prev = document.getElementById('hPrev');
  var next = document.getElementById('hNext');
  if (prev) prev.addEventListener('click', function () { loadHistory(historyPage - 1); });
  if (next) next.addEventListener('click', function () { loadHistory(historyPage + 1); });
}

async function refresh() {
  let d;
  try { d = await (await fetch('/api/status')).json(); }
  catch { document.getElementById('conn').innerHTML = '<p class="bad">אין תקשורת עם הגשר</p>'; return schedule(4000); }

  const conn = document.getElementById('conn');
  if (d.state === 'ready') {
    const me = d.me ? (d.me.name + ' (' + d.me.number + ')') : '';
    conn.innerHTML = '<p class="good">✔ מחובר ' + me + '</p>' +
      '<button class="ghost" onclick="logout()">נתק חשבון</button>';
    schedule(15000);
  } else if (d.state === 'qr' && d.qr) {
    conn.innerHTML =
      '<p>סרוק מהוואטסאפ של החנות (מכשירים מקושרים ▸ קישור מכשיר):</p>' +
      '<img id="qr" src="' + d.qr + '">' +
      '<p>או חבר עם קוד — הזן את מספר החנות:</p>' +
      '<input id="num" placeholder="9725XXXXXXXX" dir="ltr">' +
      '<button onclick="pair()">קבל קוד צימוד</button>' +
      '<div id="code"></div><div class="msg" id="pmsg"></div>';
    schedule(5000);
  } else {
    conn.innerHTML = '<p>מצב: ' + (d.state || 'לא ידוע') + '</p>';
    schedule(3000);
  }

  const c = d.counters || {};
  document.getElementById('stats').innerHTML =
    '<span>היום: <b>' + (c.sent_today || 0) + '</b></span>' +
    '<span>בשעה: <b>' + (c.sent_hour || 0) + '</b></span>' +
    '<span>קמפיינים היום: <b>' + (c.campaign_today || 0) + '</b></span>';
  const flags = [];
  if (d.paused) flags.push('<span class="bad">מושהה</span>');
  if (d.quiet) flags.push('שעות שקט');
  if (d.breaker && d.breaker.open) flags.push('<span class="bad">מפסק זרם פתוח</span>');
  if (d.warmup_day) flags.push('חימום יום ' + d.warmup_day);
  document.getElementById('flags').innerHTML = flags.join(' · ');

  renderQueue(d);

  // מרעננים היסטוריה רק כשהמשתמש בעמוד הראשון — אחרת נקפיץ אותו מהעמוד
  // שהוא קורא בו כרגע באמצע דפדוף. חריג: אם הטעינה האחרונה נכשלה, מנסים שוב
  // את אותו עמוד, כדי שהכרטיס יתאושש לבד כשה-WP חוזר.
  if (historyError) { loadHistory(historyPage); }
  else if (historyPage === 1) { loadHistory(1); }
}

async function pair() {
  const num = document.getElementById('num').value;
  const msg = document.getElementById('pmsg');
  msg.textContent = 'מבקש קוד…';
  clearTimeout(timer);
  try {
    const d = await (await fetch('/api/pair', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ number: num }) })).json();
    if (!d.ok) throw new Error(d.error);
    document.getElementById('code').textContent = d.code;
    msg.textContent = 'הקלד את הקוד בוואטסאפ תוך דקה.';
  } catch (e) { msg.textContent = e.message; }
  schedule(5000);
}

async function sendNow() {
  const phone = document.getElementById('snPhone').value;
  const text = document.getElementById('snText').value;
  const msg = document.getElementById('snMsg');
  const btn = document.getElementById('snBtn');
  if (!phone || !text.trim()) { msg.textContent = 'צריך מספר וטקסט'; return; }
  btn.disabled = true;
  msg.textContent = 'שולח…';
  try {
    const d = await (await fetch('/api/send-now', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: phone, text: text })
    })).json();
    if (!d.ok) throw new Error(d.error);
    msg.innerHTML = '<span class="good">✔ נשלח</span>';
    document.getElementById('snText').value = '';
  } catch (e) {
    msg.innerHTML = '<span class="bad">שגיאה: ' + e.message + '</span>';
  } finally {
    btn.disabled = false;
  }
}

async function logout() {
  if (!confirm('לנתק את חשבון הוואטסאפ?')) return;
  try { await fetch('/api/logout', { method: 'POST' }); } catch {}
  schedule(2000);
}

refresh();
loadHistory(1);
</script>
</body>
</html>
